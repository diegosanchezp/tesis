
events { }

http {
    # Avoid error was not loaded because its MIME type, "text/html", is not
    include  /etc/nginx/mime.types;

    # https://docs.djangoproject.com/en/4.2/howto/deployment/checklist/#allowed-hosts
    # http://nginx.org/en/docs/http/request_processing.html#how_to_prevent_undefined_server_names
    # Return “444 No Response” on an unrecognized host:
    server {
        listen 80 default_server;
        server_name "";
        # http to https redirect
        if ($host = {{ hostname }} ) {
            return 301 https://$host$request_uri;
        }
        return 444;
    }


    server {

        # listen 80;
        # listen [::]:80;
        server_name {{ hostname }};
        listen 443 ssl;
        listen [::]:443 ssl;

        # Fix warning for static files
        add_header 'Content-Security-Policy' 'upgrade-insecure-requests';

        large_client_header_buffers 4 16k;


        # Also fowards requests to s3
        location / {
            proxy_pass http://django:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            client_max_body_size 20m;

            # We are configuring buffers with these directives because the HX-Trigger header might be big for the default
            # buffer size that NGINX sets
            # The HX-Trigger header usually contains HTML
            # https://docs.nginx.com/nginx/admin-guide/web-server/reverse-proxy/#configuring-buffers

            # specifies the size of the buffer used for reading the first part of the response from a proxied serve
            proxy_buffer_size 64k;
            proxy_buffers 16 32k;
            # set the maximum size of buffers that can be used for sending data to the client while NGINX is still receiving data from the proxied server
            proxy_busy_buffers_size 64k;
        }

        # Public media
        location /static/ {
            # Replacement for /static/, it will be resolved to
            alias /app/staticfiles/;
        }

        # Private media internal location
        location /pmedia/ {
            internal;
            alias /app/s3mount/private_media/;
        }

        {% if production %}
        # production certificate
        ssl_certificate /etc/letsencrypt/live/{{ hostname }}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/{{ hostname }}/privkey.pem;
        {% endif %}

        {% if production_test %}
        # local prod test cerificates
        ssl_certificate /app/mkcert/127.0.0.1.crt;
        ssl_certificate_key /app/mkcert/127.0.0.1.key;
        {% endif %}
    }
}
